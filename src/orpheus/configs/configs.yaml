model:
  block_size: 256        # max sequence length
  vocab_size: 65        # size of tokenizer vocab
  n_embed: 384           # embedding dimension
  num_layers: 6           # number of Transformer layers
  num_heads: 8            # number of attention heads
  optimizer:
    lr: 0.0003            # learning rate
    adam_betas: [0.9, 0.95] # Adam betas
    adam_eps: 1e-8        # Adam epsilon
    weight_decay: 0.01    # weight decay
    warmup_updates: 4000  # warmup steps
    end_learning_rate: 1e-5
    total_num_update: 50000 # total number of updates

train:
  dropout: 0.1            # dropout probability
